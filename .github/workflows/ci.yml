---
name: Ansible OpenWISP InfluxDB CI Build

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-build-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.distro }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        include:
          # Below passwords are only meant for testing
          - distro: ubuntu2404
          - distro: ubuntu2204
            influxdb_user_username: null
            influxdb_user_password: null
          - distro: debian12
            influxdb_user_username: "openwisp"
            influxdb_user_password: "uo3ooPoeshoo1Fai6eil5goNg1ohVie"
          - distro: debian13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Install python dependencies
        id: deps
        run: |
          pip install -r requirements-test.txt

      - name: Install Ansible Galaxy dependencies
        id: galaxy
        run: ansible-galaxy collection install "community.general:>=3.6.0"

      - name: QA checks
        run: |
          ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.galaxy.conclusion == 'success' }}
        run: molecule test
        env:
          ROLE_NAME: ow_influxdb
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          MOLECULE_DISTRO: ${{ matrix.distro }}
          INFLUXDB_USER_USERNAME: ${{ matrix.influxdb_user_username }}
          INFLUXDB_USER_PASSWORD: ${{ matrix.influxdb_user_password }}

  import:
    name: Update imports on Ansible Galaxy
    environment: ansible-galaxy
    concurrency:
      group: galaxy-import-${{ github.repository }}-${{ github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs:
      - build

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install ansible
        run: pip install ansible

      - name: Update imports on Ansible Galaxy
        run: |
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" --role-name influxdb openwisp ansible-ow-influxdb
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
